extends: existence
message: "'%s' claims verification without a qualifier. Say verified by what, on what domain, under what assumptions."
link: https://github.com/larsbx/objective-review-metasytem/blob/main/research_hygiene/RESEARCH_HYGIENE_MANIFESTO.md#i-declare-the-status-of-every-claim
level: warning
ignorecase: true
