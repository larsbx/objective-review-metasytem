; Root Vale configuration.
;
; CONTRIBUTING tells contributors to run `vale **/*.md`. Vale reads the config
; from the working directory, so without a config here that instruction does
; nothing. This file makes it runnable from the repository root.
;
; It reuses the styles already kept under integrations/vale/styles rather than
; standing up a second styles tree, and it deliberately loads no external
; packages, so it runs offline without `vale sync`. The richer example
; configuration in integrations/vale/.vale.ini adds the Microsoft and Google
; packages and stays opt-in.

StylesPath = integrations/vale/styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = Docs, ResearchHygiene

; Generated agent data is not prose.
[dist/**]
BasedOnStyles =
